name: test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:

    strategy:
      matrix:
        dotnet-version: [11, 10, 8]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}.x.x

      - run: dotnet run --project tests -c Debug   -f net${{ matrix.dotnet-version }}.0
      - run: dotnet run --project tests -c Release -f net${{ matrix.dotnet-version }}.0
